[project]
name = "g4-trial-cert-requestor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=request_cert",
    "--cov=mail_watch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
